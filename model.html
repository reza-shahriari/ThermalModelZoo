<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>

<body class="bg-background font-body-md text-on-surface antialiased min-h-screen flex flex-col" data-page="catalogue">
<div id="site-header"></div>
<main class="w-full pt-16 bg-surface flex-1" id="model-root">
<div class="max-w-7xl mx-auto w-full px-gutter py-space-xl font-mono-data-md text-on-surface-variant">Loading model…</div>
</main>
<div id="lightbox" class="lightbox fixed inset-0 z-[60] bg-black/90 flex items-center justify-center p-4" hidden role="dialog" aria-modal="true" aria-label="Image viewer">
<button id="lb-close" type="button" class="absolute top-4 right-4 h-10 w-10 rounded bg-surface-container-high text-on-surface flex items-center justify-center" aria-label="Close"><span class="material-symbols-outlined">close</span></button>
<button id="lb-prev" type="button" class="absolute left-4 h-10 w-10 rounded bg-surface-container-high text-on-surface flex items-center justify-center" aria-label="Previous image"><span class="material-symbols-outlined">chevron_left</span></button>
<figure class="max-w-[92vw] max-h-[88vh] flex flex-col gap-2"><img id="lb-img" class="max-w-full max-h-[80vh] object-contain" alt=""/><figcaption id="lb-cap" class="text-center font-mono-data-md text-on-surface-variant"></figcaption></figure>
<button id="lb-next" type="button" class="absolute right-4 h-10 w-10 rounded bg-surface-container-high text-on-surface flex items-center justify-center" aria-label="Next image"><span class="material-symbols-outlined">chevron_right</span></button>
</div>

<div id="site-footer"></div>
<script src="assets/js/core.js"></script>
<script src="assets/js/layout.js"></script>
