name: validate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Catalogue rules (licences, fields, images, sizes)
        run: python3 tools/validate.py
      - name: Generated files are current
        run: |
          python3 tools/gen_tokens.py
          git diff --exit-code assets/
